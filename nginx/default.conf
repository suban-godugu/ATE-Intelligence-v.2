# Upstream mappings
upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:3000;
}

# Global client upload limit
client_max_body_size 100M;

# Rate limit zone for API endpoints: 30 requests per second
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=30r/s;

# Connection upgrades map for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Production Body Size Limit (100MB)
    client_max_body_size 100M;

    # Backend API proxy with Rate Limiting and 120s timeouts
    location /api/ {
        limit_req zone=api_limit_zone burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 120s Proxy Timeout Guards
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # MinIO console proxy location (for dev access to MinIO UI at /minio-console/):
    location /minio-console/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # MinIO API proxy for presigned URL passthrough:
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
    }

    # WebSocket gateway connection upgrade
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard WS connections timeouts (keep open)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Next.js web application
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
